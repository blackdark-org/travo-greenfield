[tools]
go = "1.27.3"
node = "26.13.0"
pnpm = "12.18.0"

[tasks.check]
description = "Everything CI checks"
depends = ["check:go", "check:web", "check:gen", "check:size"]

[tasks."check:go"]
description = "gofmt, vet, tests"
run = '''
test -z "$(gofmt -l .)"
go vet ./...
go test ./...
'''

[tasks."web:install"]
description = "Install web dependencies from the lockfile (shared so parallel tasks do not race)"
run = "pnpm -C web install --frozen-lockfile"

[tasks."check:web"]
description = "Web: biome, svelte-check, vitest, build, size-limit"
depends = ["web:install", "gen"] # gen first: check reads src/lib/api/gen
run = "pnpm -C web check"

[tasks.gen]
description = "Regenerate the hey-api client from the Go spec (web/openapi.json is a git-ignored intermediate)"
depends = ["web:install"]
run = '''
go run ./cmd/openapi > web/openapi.json
pnpm -C web gen
'''

[tasks."check:gen"]
description = "Generated client is committed and matches the Go handlers"
depends = ["gen"]
# porcelain also catches new untracked generated files, which `git diff` ignores
run = '''
git diff --exit-code -- web/src/lib/api/gen
test -z "$(git status --porcelain -- web/src/lib/api/gen)"
'''

[tasks.build]
description = "Static aarch64 binary for the router"
run = '''
CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
  -ldflags "-s -w -X github.com/BlackDark/travo-greenfield/internal/version.Version=${VERSION:-dev} -X github.com/BlackDark/travo-greenfield/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
  -o dist/travo-greenfield-arm64 ./cmd/travo-greenfield
'''

[tasks."test:integration"]
description = "Run adapter tests against real uci/apk/opkg in OpenWrt containers (needs Docker)"
usage = 'arg "[arch]" help="arm64 or amd64; both when omitted"'
run = '''
case "${usage_arch:-}" in ""|arm64|amd64) ;; *) echo "unknown arch: ${usage_arch}" >&2; exit 2 ;; esac
mkdir -p dist
for spec in "linux/aarch64_generic arm64 openwrt/rootfs:aarch64_generic-25.12.6@sha256:22f13387da208c0fb4150c41f3ec12e34cc5994a0717a49e50aa9f9ae6cb5e7b" "linux/amd64 amd64 openwrt/rootfs:x86-64-24.10.8@sha256:9972a4b4747cd136abd597475d7b88c51a49fd849d0d53f069a2f4bf446061b9"; do
  set -- $spec
  [ -z "${usage_arch:-}" ] || [ "$2" = "$usage_arch" ] || continue
  CGO_ENABLED=0 GOOS=linux GOARCH=$2 go test -tags integration -c -o dist/cli-$2.test ./internal/device/cli
  CGO_ENABLED=0 GOOS=linux GOARCH=$2 go test -tags integration -c -o dist/pkgmgr-$2.test ./internal/pkgmgr
  CGO_ENABLED=0 GOOS=linux GOARCH=$2 go test -tags integration -c -o dist/dnslayer-$2.test ./internal/dnslayer
  CGO_ENABLED=0 GOOS=linux GOARCH=$2 go test -tags integration -c -o dist/txn-$2.test ./internal/txn
  docker run --rm --platform $1 --entrypoint sh -v "$PWD/dist:/t:ro" "$3" -c "mkdir -p /var/lock && /t/cli-$2.test -test.run TestRealUCI -test.v && /t/pkgmgr-$2.test -test.run TestRealManager -test.v && /t/dnslayer-$2.test -test.run TestRealStack -test.v && /t/txn-$2.test -test.run '^TestReal(WatchdogRestoresAfterDaemonDeath|ConfirmKeepsChange)$' -test.v"
  # booted container (procd as PID 1): watchdog must survive a procd service stop
  name=travo-itest-$2
  docker rm -f $name >/dev/null 2>&1 || true
  docker run -d --name $name --platform $1 -v "$PWD/dist:/t:ro" "$3" /sbin/init >/dev/null
  # wait until boot finished (procd runs /etc/rc.d, then the "done" init script)
  for _ in $(seq 1 60); do docker exec $name sh -c 'ubus call service list "{\"name\":\"dnsmasq\"}" | grep -q running' 2>/dev/null && break; sleep 1; done
  docker exec $name /t/txn-$2.test -test.run TestRealWatchdogSurvivesProcdStop -test.v; rc=$?
  # root account (empty shadow -> passwd -> rpcd login) needs the booted rpcd; runs last: it sets a password
  [ $rc -eq 0 ] && { docker exec $name /t/cli-$2.test -test.run TestRealRootAccount -test.v; rc=$?; }
  docker rm -f $name >/dev/null
  [ $rc -eq 0 ] || exit $rc
done
'''

[tasks."check:size"]
description = "Stripped arm64 binary stays within the 12.8 MB budget (invariants §15)"
depends = ["build"]
run = '''
size=$(wc -c < dist/travo-greenfield-arm64)
echo "binary: $size bytes (budget 13421772)"
test "$size" -le 13421772
'''
