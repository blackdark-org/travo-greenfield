# CI for every repo (from BlackDark/agent-presets). Copy to .github/workflows/ci.yml.
# - One workflow, one required check: `check`. Area jobs can be added, renamed or skipped without touching the ruleset.
#   Required checks match by NAME across ALL workflows. Do not add a second workflow with its own gate (a fast
#   `lint.yml` gate once satisfied the ruleset before CI finished); put checks here as another area instead.
# - Areas: `app` runs `mise run check`; `lint` checks workflows and Renovate config. PRs run only the areas they
#   touch (docs-only PRs run neither); main, workflow_call and manual runs run every area. Tags arrive via
#   release.yml calling this workflow (workflow_call), so no tag trigger here: it would run CI twice.
# - One code area (most repos): keep the file as is. Several (frontend + firmware, ansible + pulumi): copy the `app`
#   job per area, add its output and a line in `changes`, and its name to the `check` job's `needs`.
# - No Renovate config or nothing else to lint: delete the `lint` jobs, their output and the name in `needs`.
# - Path detection uses plain git: a PR checkout is the merge commit, so HEAD^1..HEAD is exactly the PR's diff.
#   No third-party action and no extra permission, so release.yml can still call this with `contents: read`.
# - `check` needs `if: always()`: a skipped job reports success, so without it a failed area would leave the gate green.
#   Cancelled counts as failed, so a manually cancelled run can't be merged either.
# - Draft PRs skip `changes`; area jobs inherit the skip and `check` passes (drafts can't be merged anyway).
# - Merge queue: add `merge_group:` to `on:`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: "1.7.12"
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.221.1"

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.areas.outputs.app }}
      lint: ${{ steps.areas.outputs.lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and its base parent
          persist-credentials: false
      - id: areas
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            { echo "app=true"; echo "lint=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          has() { grep -qE "$1" <<< "$changed" && echo true || echo false; }
          # One line per area. app: anything that is not docs, CI or Renovate config (mise.toml, lockfiles count),
          # or this file itself, so a broken `mise run check` step is caught.
          app=$(has '^\.github/workflows/ci\.yml$')
          grep -qvE '^(docs/|\.github/|renovate\.json5?$|LICENSE$)|\.md$' <<< "$changed" && app=true
          {
            echo "app=$app"
            echo "lint=$(has '^(\.github/|renovate\.json5?$)')"
          } >> "$GITHUB_OUTPUT"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7 tools from mise.toml; Rust from rust-toolchain.toml via rustup
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }} # PRs reuse main's toolchain cache (192 MB each otherwise)
      # Go module + build cache and the pnpm store, keyed on the toolchain pins and lockfiles.
      # restore-keys fall back to the newest older cache, so a dependency bump stays warm.
      # Only main saves: PR runs reuse main's cache and cannot evict or poison it.
      - id: dirs
        run: |
          {
            echo "gomod=$(go env GOMODCACHE)"
            echo "gobuild=$(go env GOCACHE)"
            echo "pnpm=$(pnpm -C web store path --silent)"
          } >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.dirs.outputs.gomod }}
            ${{ steps.dirs.outputs.gobuild }}
            ${{ steps.dirs.outputs.pnpm }}
          key: build-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum', 'web/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum', 'web/pnpm-lock.yaml') }}-
            build-${{ runner.os }}-
      - run: mise run check
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.dirs.outputs.gomod }}
            ${{ steps.dirs.outputs.gobuild }}
            ${{ steps.dirs.outputs.pnpm }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Container layer (docs/testing.md): one matrix job per OpenWrt image, same gate as `app`.
  integration:
    name: integration (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm # aarch64_generic image runs natively, no QEMU
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7 tools from mise.toml
        with:
          cache_save: ${{ github.ref == 'refs/heads/main' }} # restore-only here; the app job on main saves
      - id: dirs
        run: |
          {
            echo "gomod=$(go env GOMODCACHE)"
            echo "gobuild=$(go env GOCACHE)"
            echo "pnpm=$(pnpm -C web store path --silent)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.dirs.outputs.gomod }}
            ${{ steps.dirs.outputs.gobuild }}
            ${{ steps.dirs.outputs.pnpm }}
          key: build-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum', 'web/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum', 'web/pnpm-lock.yaml') }}-
            build-${{ runner.os }}-
      - run: mise run test:integration ${{ matrix.arch }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color .github/workflows/*.yml

  renovate-config:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  zizmor:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true

  check:
    if: always()
    needs: [changes, app, integration, actionlint, renovate-config, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
