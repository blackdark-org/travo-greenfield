# Builds, signs and attaches the router tarball to an existing GitHub release (docs/adr/0007).
# Called by release-please.yml (`publish`) because a tag pushed with GITHUB_TOKEN starts no
# workflows; run it by hand with workflow_dispatch to retry a tag. It never creates the release.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
        type: string
    secrets:
      MINISIGN_SECRET_KEY:
        required: false # absent until the operator creates the key; the gate step then fails loudly
      MINISIGN_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
        type: string

permissions: {}

jobs:
  sign-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # gh release upload
    steps:
      - name: Require the signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Require the public key
        run: |
          if [ ! -f packaging/minisign.pub ]; then
            echo "::error::packaging/minisign.pub missing"
            exit 1
          fi
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7 tools from mise.toml
        with:
          cache_save: false
      - run: mise run check
      - name: Package
        env:
          TAG: ${{ inputs.tag }}
        run: VERSION="${TAG#v}" mise run package
      - name: Sign checksums.txt
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          # -l: legacy format, the one the router's usign verifies
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -l -s "$RUNNER_TEMP/minisign.key" -m dist/checksums.txt
          # usign reads only the untrusted comment and the signature line
          head -n 2 dist/checksums.txt.minisig > dist/checksums.txt.sig
      - name: Verify the signature
        run: minisign -V -m dist/checksums.txt -x dist/checksums.txt.minisig -p packaging/minisign.pub
      - name: Remove the secret key
        if: always()
        run: rm -f "$RUNNER_TEMP/minisign.key"
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            "dist/travo-greenfield-${TAG#v}-aarch64.tar.gz" \
            dist/checksums.txt dist/checksums.txt.sig \
            --clobber
